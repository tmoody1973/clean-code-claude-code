name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m py_compile scripts/prod_audit.py
      - run: python -m unittest discover tests -v
      - name: self-audit
        run: python scripts/prod_audit.py --repo . --profile cli --fail-on critical --output /dev/null
